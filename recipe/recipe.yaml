context:
  version: "0.8.0"

package:
  name: spaday-perspective
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-perspective/spaday_perspective-${{ version }}.tar.gz
  sha256: e6689d7058b4e718ab45ba63db28a362574cbd604314122ff9fd2d402c5f605b

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - perspective >=5.5,<5.6
    - spaday >=0.8.2,<1.0

tests:
  - python:
      imports:
        - spaday_perspective
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Perspective for spaday
  homepage: https://github.com/1kbgz/spaday-perspective
  repository: https://github.com/1kbgz/spaday-perspective

extra:
  recipe-maintainers:
    - timkpaine
