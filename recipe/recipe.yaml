context:
  version: "0.4.1"
  python_min: "3.11"

package:
  name: spaday-perspective
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-perspective/spaday_perspective-${{ version }}.tar.gz
  sha256: 958a78b31434674ca732c6ca9ad5221052acd570eed868c78964f73e76a5d548

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - perspective >=5.2,<5.3
    - spaday >=0.6.0

tests:
  - python:
      imports:
        - spaday_perspective
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Perspective for spaday
  homepage: https://github.com/1kbgz/spaday-perspective
  repository: https://github.com/1kbgz/spaday-perspective

extra:
  recipe-maintainers:
    - timkpaine
