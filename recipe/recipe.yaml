context:
  version: "0.7.1"

package:
  name: spaday-perspective
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-perspective/spaday_perspective-${{ version }}.tar.gz
  sha256: 005d3352be19849ea733ad0f17c8cb075edb60c729db56ea0a09fad87cbd59e3

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - perspective >=5.4,<5.5
    - spaday >=0.8.2,<1.0

tests:
  - python:
      imports:
        - spaday_perspective
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Perspective for spaday
  homepage: https://github.com/1kbgz/spaday-perspective
  repository: https://github.com/1kbgz/spaday-perspective

extra:
  recipe-maintainers:
    - timkpaine
